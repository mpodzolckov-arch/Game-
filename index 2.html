function arenaSim(mine,foe){
  const mkU=(x,sd)=>({c:x.c,hp:x.hp,max:x.hp,a:x.a,d:x.d,cd:x.cd||4,t:x.cd||4,sm:x.sm||1,hs:x.hs,ws:x.ws,n:x.n,sd});
  const U=[mine.map(x=>mkU(x,0)),foe.map(x=>mkU(x,1))],frames=[];
  const tot=i=>U[i].reduce((a,u)=>a+Math.max(0,u.hp),0),mx=i=>U[i].reduce((a,u)=>a+u.max,0);
  const fr=lines=>frames.push({u:U.map(r=>r.map(u=>[Math.max(0,Math.round(u.hp)),u.max])),log:lines});
  const nm=u=>CL[u.c].i+" "+(u.n?esc(u.n):CL[u.c].n);
  fr(["⚔️ Бой начался!"]);
  for(let r=1;r<=40&&tot(0)>0&&tot(1)>0;r++){
    const lines=["Раунд "+r],order=[];
    U[0].forEach((u,i)=>order.push(u));U[1].forEach(u=>order.push(u));order.sort(()=>Math.random()-.5);
    for(const u of order){
      if(u.hp<=0)continue;
      const foes=U[1-u.sd].filter(x=>x.hp>0),al=U[u.sd].filter(x=>x.hp>0);if(!foes.length)break;
      const use=u.t<=0,heal=(u.c==="medic"||u.c==="angel");
      if(use)u.t=u.cd;else u.t--;
      if(heal&&use&&u.c==="medic"){al.forEach(x=>x.hp=Math.min(x.max,x.hp+x.max*.25*u.sm));lines.push(nm(u)+" ✨ лечит отряд");continue;}
      if(heal&&!use&&Math.random()<.6){const w=al.slice().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0],g=Math.round(w.max*.07+u.a*.4);w.hp=Math.min(w.max,w.hp+g);lines.push(nm(u)+" 💚 +"+g);continue;}
      const f=foes[rnd(0,foes.length-1)];
      let dm=u.a*(.9+Math.random()*.2);if(Math.random()<.15)dm*=2;
      if(use)dm*=(u.c==="assassin"?4:CL[u.c].dv?4.5:3.5)*u.sm;
      if(use&&heal)al.forEach(x=>x.hp=Math.min(x.max,x.hp+x.max*.2));
      dm=Math.max(1,Math.round(dm*100/(100+f.d*3)));f.hp-=dm;
      lines.push(nm(u)+(use?" ✨":"")+" → "+nm(f)+" −"+dm+(f.hp<=0?" ☠️":""));
    }
    fr(lines.slice(0,6));
  }
  const a=tot(0)/mx(0),b=tot(1)/mx(1);
  return{frames,win:tot(1)<=0?true:tot(0)<=0?false:a>=b};
}

  }
  const head=tab==="bt"?'<div class="tabs"><b style="padding:6px 8px">⚔️ Арена</b></div>':tab==="tut"?'<div class="tabs"><b style="padding:6px 8px">Как играть</b></div>':tab==="rename"?'<div class="tabs"><button data-t="team">← Назад</button></div>':tab==="pick"?(s.heroes.length?'<div class="tabs"><button data-a="close">✕ Закрыть</button></div>':'<div class="tabs"><b style="padding:6px 8px">Выбери героя</b></div>'):'<div class="tabs">'+T.map(t=>'<button data-t="'+t[0]+'"'+(t[0]===tab?' class="on"':"")+">"+t[1]+"</button>").join("")+'<button data-a="close">✕</button></div>';
  $("sh").innerHTML=head+'<div class="body">'+b+"</div>";
}
const ACT={
  close(){if(tab==="bt"&&bt&&!bt.done)return;if(s.heroes.length)$("sheet").hidden=true;},
  afight(u){if(!arena||!arena.me||arena.me.left<1||!s.heroes.length)return;post("/arena/fight",{opp:+u}).then(r=>r.json()).then(d=>{if(d.error){note(d.error==="limit"?"Бои на сегодня закончились":"Соперник недоступен, обнови список");fetchArena();return;}startBattle(d.opp);}).catch(()=>note("Сервер не отвечает, попробуй позже"));},
  arefresh(){fetchArena();},
  btskip(){if(bt&&!bt.done)btFinish();},
  btend(){clearInterval(btTimer);bt=null;tab="arena";fetchArena();},
  pick(c){
    const d=CL[c];
    if(d.pr&&!m.unl[c]){if(m.cr<d.pr)return note("Нужно "+d.pr+" 💎, у тебя "+m.cr+". Кристаллы дают боссы, сундуки и обмен золота.");m.cr-=d.pr;m.unl[c]=true;}
    pick(c);
  },
  sel(i){s.sel=+i;},
  claimA(id){const a=ACH.find(x=>x[0]===id);if(!a||m.ac[id]||!a[3]())return;m.ac[id]=1;m.cr+=a[4];SFX.ach();log("🏅 Награда: +"+a[4]+" 💎 — "+a[1]);},
  invite(){try{const u="https://t.me/share/url?url="+encodeURIComponent(inviteLink())+"&text="+encodeURIComponent("Заходи в «Пепел Эльдары» — фэнтези-RPG прямо в Telegram! Тебе +10 💎 за вход по моей ссылке.");
    if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,"_blank");}catch(e){}},
  snd(){m.mute=m.mute?0:1;if(!m.mute)SFX.ach();},
  tutn(){if(tutI<TUT.length-1){tutI++;}else{m.tut=1;if(s.heroes.length)$("sheet").hidden=true;else tab="pick";}},
  rename(i){renI=i;tab="rename";},
  savename(){const x=renI[0]==="h"?s.heroes[+renI.slice(1)]:s.bench[+renI.slice(1)];const v=($("nm")&&$("nm").value||"").trim().slice(0,14);if(x){if(v)x.name=v;else delete x.name;}tab="team";},
  savename0(){const x=renI[0]==="h"?s.heroes[+renI.slice(1)]:s.bench[+renI.slice(1)];if(x)delete x.name;tab="team";},
  recruit(){tab="pick";},
  slot(){if(m.slots>=MAXS||m.cr<SLOT)return;m.cr-=SLOT;m.slots++;log("🔓 Открыта ячейка героя!");},
  bench(i){i=+i;if(s.heroes.length<2)return;s.bench.push(s.heroes.splice(i,1)[0]);s.sel=Math.max(0,Math.min(s.sel,s.heroes.length-1));spawn();},
  unbench(i){i=+i;const x=s.bench[i];if(!x)return;if(s.heroes.length<m.slots){s.bench.splice(i,1);s.heroes.push(x);s.sel=s.heroes.length-1;}else{const o=s.heroes[s.sel];s.heroes[s.sel]=x;s.bench[i]=o;}spawn();},
  upS(){const h=sel(),c=slCost(h);if((h.sl|0)>=SLM||s.gold<c)return;s.gold-=c;h.sl=(h.sl|0)+1;log("✨ "+CL[h.cls].sk+" улучшен до ур. "+h.sl);},
  upW(){const h=sel(),c=costs(h).sword;if(h.wl>=WMAX||s.gold<c)return;s.gold-=c;h.wl++;log(wp(h)[0]+" "+wp(h)[1]+" улучшен до ур. "+h.wl);},
  upA(){const h=sel(),nx=ARM[h.arm+1];if(!nx)return;if(nx[2]){if(s.gold<nx[2])return;s.gold-=nx[2];}else{if(m.cr<nx[3])return;m.cr-=nx[3];}h.arm++;log("🛡️ "+CL[h.cls].i+" получил: "+nx[0]);},
  ex(){const h=sel();if(m.ex[h.cls]||m.cr<EXC)return;m.cr-=EXC;m.ex[h.cls]=true;log("💎 Эксклюзив: "+CL[h.cls].x[1]+"!");},
  bpot(){const c=costs(sel()).pot;if(s.gold<c)return;s.gold-=c;s.pot++;},
  bfood(){const c=costs(sel()).food*3;if(s.gold<c)return;s.gold-=c;s.food+=3;},
  pot(){const h=sel();if(!h||s.pot<1||h.hp>=h.maxHp)return;s.pot--;const was=h.hp<=0;h.hp=Math.min(h.maxHp,Math.max(h.hp,0)+Math.ceil(h.maxHp/2));h.rez=0;log(was?"✨ "+CL[h.cls].i+" воскрешён зельем!":"🧪 "+CL[h.cls].i+" выпил зелье.");pop("h"+s.sel,"💚","h");},
  feed(){let n=0;s.heroes.forEach(h=>{if(h.hun<=70&&s.food>0){s.food--;h.hun=Math.min(100,h.hun+40);n++;}});if(n)log("🍖 Накормлено героев: "+n);},
  equip(i){const h=sel(),it=s.inv[+i];if(!it)return;const k=it.t==="w"?"lw":"la",old=h[k];h[k]=it;s.inv.splice(+i,1);if(old)s.inv.push(old);log("🎒 "+CL[h.cls].i+" надел: "+it.n);},
  sell(i){const it=s.inv[+i];if(!it)return;s.inv.splice(+i,1);s.gold+=it.v*6;},
  claim(){const n=dailyDay();if(!n)return;const r=dRew(n);m.daily={d:dk(0),n};s.gold+=r.g;s.food+=r.f;s.pot+=r.p;s.cw+=r.cw;s.cg+=r.cg;log("🎁 День "+n+": +"+r.g+" 💰 +"+r.f+" 🍖");notify("daily","🎁 Награда за день "+n+" получена. Завтра будет новая!");},
  chest(){openChest();},
  och(i){openCh(+i);},
  bch(i){i=+i;if(m.cr<CHP[i])return;m.cr-=CHP[i];m.ch[i]++;chestMsg="Куплен: "+CHI[i]+" "+CHN[i]+" сундук. Нажми «Открыть».";},
  g2c(n){n=+n;if(s.gold<n*1000)return;s.gold-=n*1000;m.cr+=n;m.xc=1;checkAch();chestMsg="Обмен: −"+n*1000+" 💰, +"+n+" 💎";},
  c2g(n){n=+n;if(m.cr<n)return;m.cr-=n;s.gold+=n*1000;chestMsg="Обмен: −"+n+" 💎, +"+n*1000+" 💰";},
  seq(i){const h=sel(),[k,r]=i.split(":"),key=k+":"+h.cls;if(+r<0)delete m.eq[key];else if(skOwn(k,h.cls,+r))m.eq[key]=+r;},
  sbuy(i){
    const h=sel(),[k,r0,cur]=i.split(":"),r=+r0;if(skOwn(k,h.cls,r))return;
    if(cur==="g"){if(r>1||s.gold<SKPR[r]*1000)return;s.gold-=SKPR[r]*1000;}else{if(m.cr<SKPR[r])return;m.cr-=SKPR[r];}
    m.sk[k+":"+h.cls+":"+r]=1;m.eq[k+":"+h.cls]=r;log("🎨 Куплен скин: "+RAR[r][0]+" "+(k==="h"?"героя":"оружия")+" — "+CL[h.cls].n);
  },
  newgame(){
    const q="Начать заново? Прогресс забега сбросится, кристаллы, сундуки, скины, ячейки и эксклюзивное оружие сохранятся.";
    const go=()=>{s={stage:1,gold:0,food:5,pot:1,cw:0,cg:0,sel:0,heroes:[],bench:[],inv:[],bf:0};m.pl={};m.dv=0;logs=[];save();spawn();draw();openSheet("pick");};
    if(tg&&tg.showConfirm)tg.showConfirm(q,ok=>{if(ok)go();});else if(confirm(q))go();
  }
};
function act(a,i){
  if(!ACT[a])return;
  ACT[a](i);save();draw();
  if(!$("sheet").hidden)render();
}
$("sheet").onclick=e=>{
  if(e.target===$("sheet")){ACT.close();return;}
  const b=e.target.closest&&e.target.closest("button");if(!b)return;
  if(b.dataset.t){tab=b.dataset.t;if(tab==="top")fetchTop();if(tab==="arena")fetchArena();render();return;}
  act(b.dataset.a,b.dataset.i);
};
$("team").onclick=e=>{const d=e.target.closest&&e.target.closest(".sp");if(d){s.sel=+d.dataset.i;draw();}};
const swing=k=>{if(Date.now()<busyUntil)return;attack(k);busyUntil=Date.now()+animMs;};
$("bAtk").onclick=()=>swing(null);
$("bSkill").onclick=()=>swing(sel());
$("bPot").onclick=()=>act("pot");
$("bFeed").onclick=()=>act("feed");
$("bCh").onclick=()=>openSheet("chest");
$("bAuto").onclick=()=>{auto=!auto;$("aut").textContent=auto?"вкл":"выкл";$("bAuto").style.background=auto?"#2f8a3e":"";};
setInterval(()=>{try{
  if(!auto||!$("sheet").hidden||Date.now()<busyUntil||!s.heroes.some(h=>h.hp>0))return;
  const w=s.heroes.findIndex(h=>h.hp>0&&h.hp<h.maxHp*.3);if(w>=0&&s.pot>0){s.sel=w;act("pot");}
  if(s.food>0&&s.heroes.some(h=>h.hun<=40))act("feed");
  swing(s.heroes.find(h=>h.hp>0&&h.cd<=0)||null);
}catch(e){}},500);
document.addEventListener("visibilitychange",()=>{if(document.hidden){save();cloudSave(true);}});
setInterval(()=>cloudSave(false),60000);
$("bGift").onclick=()=>openSheet("gift");
$("bMenu").onclick=()=>openSheet("shop");
spawn();
rezTick();
setInterval(()=>sendScore(),30000);
setInterval(()=>{try{
  if(!s.heroes.length)return;
  const c=rezTick();
  if(c){save();draw();if(!$("sheet").hidden)render();}
  else if(s.heroes.some(h=>h.hp<=0||h.cls==="witch"))draw();
}catch(e){}},1000);
let offMsg="";
if(s.heroes.length&&s.last){
  const el=Math.min(Date.now()-s.last,8*3600000);
  if(el>120000){const mn=el/60000,g=Math.round(mn*(2+s.stage*.8)),xp=Math.round(mn*(1+s.stage*.15));s.gold+=g;s.heroes.forEach(h=>gainXp(h,xp));
    offMsg="🌙 Отряд тренировался "+(el>=3600000?Math.floor(el/3600000)+" ч ":"")+Math.floor(el/60000%60)+" мин: +"+g+" 💰 +"+xp+" ✨";}
}
checkAch();
if(s.heroes.length){log(offMsg||"🌑 С возвращением в Пепел Эльдары!");draw();if(!m.tut)openSheet("tut");}
else{log("🌑 Добро пожаловать в Пепел Эльдары, герой!");draw();openSheet(m.tut?"pick":"tut");}
cloudLoad();fetchMe();
</script>
