<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тёмные земли</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#f1ecff;--dim:#a99fcf;--gold:#f5c542;--line:rgba(255,255,255,.14);color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0a17;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hud{display:flex;gap:4px;justify-content:space-between;align-items:center;padding:6px 10px;font-size:15px}
#hud b{color:var(--gold);margin-left:3px}
#hud button{background:none;font-size:18px;padding:2px 6px}
#scene{flex:1;position:relative;overflow:hidden;border-radius:18px 18px 0 0;display:flex;flex-direction:column;background:#111;min-height:0}
#bg{position:absolute;inset:0;z-index:0}#bg svg{width:100%;height:100%;display:block}
#zone{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:12px;opacity:.9;z-index:2;text-shadow:0 1px 3px #000}
#foe{flex:1;min-height:0;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:20px}
#ename{font-weight:700;font-size:14px;text-shadow:0 1px 3px #000,0 0 6px #000}
#foe .hpb{width:46%;height:9px;margin:4px 0}#foe .hpb i{background:#e5484d;transition:width .25s}
#eab{max-width:94%;text-align:center;font-size:11px;color:var(--gold);min-height:14px;text-shadow:0 1px 3px #000;margin-bottom:2px}
.em{position:relative;line-height:0}
.shd{position:absolute;left:14%;right:14%;bottom:-3px;height:8px;border-radius:50%;background:rgba(0,0,0,.45)}
.fig{display:inline-block;position:relative;transform-origin:50% 92%;animation:bob 1.7s ease-in-out infinite;transition:rotate .4s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.fig svg{display:block;overflow:visible}
@keyframes bob{50%{transform:translateY(-4px) scaleY(1.03)}}
#foe .fig svg{height:clamp(104px,23dvh,168px);width:auto}
#foe.big .fig svg{height:clamp(130px,29dvh,215px)}
#foe .shd{height:12px;left:10%;right:10%}
#foe .fig{filter:drop-shadow(0 0 9px rgba(255,40,70,.4)) drop-shadow(0 6px 4px rgba(0,0,0,.5))}
#log{position:relative;z-index:1;font-size:12px;line-height:1.35;text-align:center;text-shadow:0 1px 3px #000,0 0 5px #000;pointer-events:none;padding:0 10px;min-height:36px}
#log div{opacity:.55}#log div:first-child{opacity:1;font-size:13px}
#team{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;padding:16px 4px 8px}
.sp{flex:1;max-width:25%;min-width:0;text-align:center;position:relative}
.sp:nth-child(even){top:-12px}
.sp .fig svg{height:clamp(70px,14.5dvh,108px);width:auto;margin:0 auto}
.sp.sel .shd{background:rgba(255,255,255,.35);box-shadow:0 0 0 2px #fff,0 0 12px #fff}
.sp.leg .fig{filter:drop-shadow(0 0 9px var(--gold)) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.sp.aleg .fig{filter:drop-shadow(0 0 8px #ffc83d) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.sp.amy .fig{filter:drop-shadow(0 0 9px #ff4d6d) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.sp.dead{filter:grayscale(1);opacity:.5}
.sp.dead .fig{rotate:90deg;animation:none}
.sp u{position:absolute;top:-2px;right:6px;font-size:14px;text-decoration:none;z-index:2}
.hpb{height:6px;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden;margin:3px 6px}
.hpb i{display:block;height:100%;background:#46c47a;transition:width .3s}
.sp small{font-size:10px;color:#dcd4f5;text-shadow:0 1px 2px #000}
.pop{position:absolute;z-index:6;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 3px #000;pointer-events:none;animation:up .9s ease-out forwards;transform:translateX(-50%)}
.pop.s{color:#ffd24a}.pop.h{color:#7dffa8}.pop.c{color:#ffd24a;font-size:23px}.pop.e{color:#ff6b6b}
@keyframes up{to{transform:translate(-50%,-48px);opacity:0}}
.ghost{pointer-events:none;z-index:4}.ghost svg{width:100%;height:100%;display:block}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.18);opacity:.7}}
.flap{animation:flap .22s linear infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes flap{to{transform:scaleY(.55)}}
.flap2{animation:flap2 .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center 70%}@keyframes flap2{to{transform:scaleY(.8)}}
.flt{animation:flt 2.4s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-6px)}}
.flick{animation:flick .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes flick{to{transform:scale(1.04,.95)}}
.fly{animation:blink 2.6s ease-in-out infinite}@keyframes blink{50%{opacity:.1}}
.snow{animation:snow 7s linear infinite}@keyframes snow{from{transform:translateY(-20px)}to{transform:translateY(620px)}}
.ember{animation:ember 5s linear infinite}@keyframes ember{from{transform:translateY(0);opacity:1}to{transform:translateY(-380px);opacity:0}}
.rain{animation:rain .7s linear infinite}@keyframes rain{from{transform:translate(0,-30px)}to{transform:translate(-14px,620px)}}
.flash{animation:flash 5s infinite}@keyframes flash{0%,88%,100%{opacity:0}90%{opacity:.8}92%{opacity:.1}94%{opacity:.7}}
.drift{animation:drift 26s linear infinite alternate}@keyframes drift{to{transform:translateX(50px)}}
#info{padding:8px 12px;font-size:13px;background:rgba(18,12,32,.94);border-top:1px solid var(--line);line-height:1.5;min-height:62px}
.xp{height:3px;background:#0d0a17;margin-top:4px}.xp i{display:block;height:100%;background:#8b5cf6}
#bar{display:flex;gap:8px;padding:8px 10px 10px;background:rgba(18,12,32,.94);align-items:stretch}
#bar button{flex:1;background:#2c2150;border-radius:14px;font-size:22px;padding:8px 0}
#bar button small{display:block;font-size:10px;color:var(--dim)}
#bar button.big{flex:1.6;background:linear-gradient(135deg,#8b5cf6,#6d28d9);font-size:28px}
button{font:inherit;color:var(--text);border:0;background:#3a2d5c;border-radius:10px;padding:8px 10px}
button:disabled{opacity:.4}button:active{transform:scale(.96)}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:30}
#sheet[hidden]{display:none}
#sh{width:100%;max-height:84%;display:flex;flex-direction:column;background:rgba(18,12,32,.97);border-radius:20px 20px 0 0;border-top:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:10px 10px 4px;overflow-x:auto}
.tabs button{background:none;font-size:13px;white-space:nowrap;padding:6px 8px}.tabs button.on{background:#3a2d5c}
.body{overflow:auto;padding:4px 14px 18px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.r small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.r button{white-space:nowrap}
.sp.k0 .fig{filter:drop-shadow(0 0 6px #4aa3ff) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.sp.k1 .fig{filter:drop-shadow(0 0 7px #b266ff) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.sp.k2 .fig{filter:drop-shadow(0 0 9px #ffc83d) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.sp.k3 .fig{filter:drop-shadow(0 0 10px #ff3b5c) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.sp.k4 .fig{filter:drop-shadow(0 0 7px #fff1b8) drop-shadow(0 0 13px #ffd34a) drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.sp.dead u{font-size:12px;top:30%;right:auto;left:0;right:0;font-weight:700;color:#fff}
.bub{position:absolute;z-index:8;background:#fff;color:#1b1226;font-size:11px;font-weight:600;line-height:1.25;padding:4px 8px;border-radius:10px;max-width:48%;pointer-events:none;box-shadow:0 2px 6px #0009;animation:bub 2.1s ease forwards}
.bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.e{background:#2a0d18;color:#ffd0d6;border:1px solid #ff4d6d}.bub.e::after{border-top-color:#2a0d18}
@keyframes bub{0%{opacity:0;transform:translateY(6px) scale(.8)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.fxp svg{width:100%;height:100%;display:block;overflow:visible}
.ring{position:absolute;border-radius:50%;pointer-events:none;z-index:6}
.pv{display:inline-block;width:42px;height:54px;flex:none}.pv svg{width:100%;height:100%;display:block}
.pvr{display:flex;align-items:center;gap:10px}
.r span.bs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.r button.sm{padding:6px 8px;font-size:12px}
.pop.b{color:#ff9a3a}
#foe.big .fig{filter:drop-shadow(0 0 14px rgba(255,30,60,.55)) drop-shadow(0 6px 4px rgba(0,0,0,.5))}
#foe .fig svg{filter:contrast(1.12) saturate(1.1)}
.cht{padding:8px 10px;margin:6px 0;border-radius:10px;background:#2a1f48;font-size:13px;line-height:1.4}
.spin{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
#foe.gold #enf svg{filter:sepia(1) saturate(4.5) hue-rotate(-14deg) brightness(1.18)}
#foe.gold .fig{filter:drop-shadow(0 0 14px #ffd34a) drop-shadow(0 0 4px #fff3b0) drop-shadow(0 6px 4px rgba(0,0,0,.5))}
#foe.elite #enf svg{filter:hue-rotate(-28deg) saturate(1.7) contrast(1.12)}
#foe.elite .fig{filter:drop-shadow(0 0 12px #ff2a4a) drop-shadow(0 6px 4px rgba(0,0,0,.5))}
/* ===== ТЁМНОЕ ФЭНТЕЗИ: оформление интерфейса ===== */
:root{--gold:#f5c542;--gd:#8a5a22;--stone:#14101c;--parch:#e8d9b0;--serif:Georgia,"Palatino Linotype","Book Antiqua",serif}
html,body{background:#0a0710}
#hud{background:linear-gradient(#2a2136,#15101d);border-bottom:2px solid var(--gd);box-shadow:0 2px 0 #000,inset 0 1px 0 #f5c54255;padding:6px 8px;font-family:var(--serif);font-weight:700;font-size:14px}
#hud>span{background:linear-gradient(#0c0810,#1a1324);border:1px solid #6a4a1e;border-radius:12px;padding:2px 9px;box-shadow:inset 0 2px 3px #000;white-space:nowrap}
#hud b{color:#ffd98a;text-shadow:0 1px 0 #000}
#hud button{background:linear-gradient(#2a2136,#161020);border:1px solid #6a4a1e;border-radius:10px;padding:2px 7px;box-shadow:0 2px 0 #000;font-family:var(--serif)}
#scene{border:2px solid #6a4a1e;border-bottom:0;box-shadow:inset 0 0 36px #000c}
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.5) 100%)}
#zone{font-family:var(--serif);font-size:13px;letter-spacing:1px;color:#f3e3b8;top:8px}
#foe{padding-top:30px}
#ename{font-family:var(--serif);font-size:15px;letter-spacing:.6px;color:#f6e6bd;text-shadow:0 2px 3px #000,0 0 8px #000}
#foe .hpb{width:64%;height:13px;margin:5px 0 3px;border:2px solid var(--gd);border-radius:8px;background:#12080c;box-shadow:0 0 0 1px #000,inset 0 2px 3px #000,0 2px 6px #000a}
#foe .hpb i{background:linear-gradient(#ff7a6a,#b3202f 60%,#7a1020);box-shadow:inset 0 1px 0 #ffffff66}
#eab{font-family:var(--serif);font-size:10.5px;line-height:1.25;min-height:0;margin:2px 0 4px;padding:0 8px;color:#e8c36a}
#log{font-family:var(--serif);font-style:italic}
.hpb{height:8px;border:1px solid #6a4a1e;border-radius:5px;background:#12080c;box-shadow:inset 0 1px 2px #000;margin:3px 7px}
.hpb i{background:linear-gradient(#7dffb0,#2fa85a 60%,#1c7a3c)}
.sp small{font-family:var(--serif);color:var(--parch);text-shadow:0 1px 2px #000,0 0 4px #000}
.sp.sel .shd{background:rgba(245,197,66,.35);box-shadow:0 0 0 2px #f5c542,0 0 14px #f5c542}
.pop{font-family:var(--serif);-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:0 2px 4px #000}
.bub{background:#f3e6c4;color:#2a1a0a;border:1px solid var(--gd);font-family:var(--serif);font-weight:700}
.bub::after{border-top-color:#f3e6c4}
.bub.e{background:#2a0d18;color:#ffd0d6;border:1px solid #ff4d6d}.bub.e::after{border-top-color:#2a0d18}
#info{background:linear-gradient(#1d1627,#110c18);border-top:2px solid var(--gd);color:#eadfc4;box-shadow:inset 0 1px 0 #f5c54233}
.xp{height:6px;border:1px solid #6a4a1e;border-radius:4px;background:#0a0710;margin-top:5px}
.xp i{background:linear-gradient(90deg,#c8861e,#ffd34a);box-shadow:0 0 6px #ffd34a88}
#bar{background:linear-gradient(#17121f,#0c0910);border-top:2px solid #6a4a1e;gap:7px}
#bar button{background:radial-gradient(circle at 50% 15%,#44385a,#1b1526 75%);border:2px solid var(--gd);border-radius:16px;box-shadow:inset 0 1px 0 #f5c54255,0 3px 0 #000,0 0 10px #0009}
#bar button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #f5c54255,0 1px 0 #000}
#bar button small{font-family:var(--serif);color:#cdbf9c}
#bar button.big{background:linear-gradient(#b02a3a,#5e0f1c);border:2px solid var(--gold);box-shadow:inset 0 2px 0 #ff9a9a66,0 3px 0 #000,0 0 16px #b3202f99}
#bSkill:not(:disabled){border-color:#a58bff;box-shadow:inset 0 1px 0 #ffffff44,0 3px 0 #000,0 0 14px #8b5cf6aa;animation:rdy 1.6s ease-in-out infinite}
@keyframes rdy{50%{box-shadow:inset 0 1px 0 #ffffff44,0 3px 0 #000,0 0 22px #c4a8ffcc}}
#sh{background:linear-gradient(#1c1625,#0f0b16);border-top:3px solid var(--gd);box-shadow:0 -8px 24px #000b,inset 0 1px 0 #f5c54266}
.tabs{border-bottom:1px solid #4a3418;padding:10px 10px 0}
.tabs button{font-family:var(--serif);color:#cdbf9c;background:none;border:1px solid transparent;border-radius:9px 9px 0 0}
.tabs button.on{background:linear-gradient(#3a2c1a,#241a10);border:1px solid var(--gd);border-bottom-color:#241a10;color:#ffd98a}
.body{padding:8px 12px 20px}
.r{background:linear-gradient(#231c2e,#181220);border:1px solid #4a3418;border-radius:12px;padding:10px 12px;margin:7px 0;box-shadow:inset 0 1px 0 #ffffff0d,0 2px 0 #0008}
.r small{color:#ab9f80}
.r button{background:linear-gradient(#e6ae3a,#a8701c);color:#1b1206;font-weight:700;border:1px solid #f5d27a;border-radius:9px;box-shadow:0 2px 0 #4a2e08}
.r button:disabled{background:#2a2432;color:#7a7088;border-color:#3a3044;box-shadow:none;opacity:1}
.r button:active{transform:translateY(1px);box-shadow:0 1px 0 #4a2e08}
.cht{font-family:var(--serif);background:linear-gradient(90deg,#3a2c14,#241a10);border-left:3px solid var(--gold);color:#ffd98a;border-radius:6px;letter-spacing:.3px}
/* питомцы */
#pet{position:absolute;left:3%;bottom:35%;z-index:4;text-align:center;pointer-events:none}
#pet .fig svg{height:clamp(46px,9dvh,70px);width:auto}
#pet small{display:block;font-family:var(--serif);font-size:10px;color:var(--parch);text-shadow:0 1px 2px #000,0 0 4px #000;margin-top:-2px}
.pop.p{color:#ffb86b;font-size:20px}
.pi{display:inline-block;width:34px;height:34px;vertical-align:middle;margin-right:4px}
.pi svg{width:100%;height:100%}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span>🗺️<b id="stage"></b></span><span>💰<b id="gold"></b></span><span>💎<b id="cr"></b></span><button id="bCh">📦<b id="chn"></b></button><button id="bGift">🎁</button><button id="bMenu">☰</button></div>
  <div id="scene">
    <div id="bg"></div><div id="zone"></div>
    <div id="foe"><div id="ename"></div><div class="hpb"><i id="ebar"></i></div><div id="eab"></div><div class="em" id="en"><i class="shd"></i><span class="fig" id="enf"></span></div></div>
    <div id="log"></div>
    <div id="team"></div><div id="pet" style="display:none"><span class="fig"></span><small></small></div>
  </div>
  <div id="info"></div>
  <div id="bar">
    <button id="bPot">🧪<small id="npot"></small></button>
    <button id="bFeed">🍖<small id="nfood"></small></button>
    <button id="bAtk" class="big">⚔️</button>
    <button id="bSkill">✨<small id="skn"></small></button>
    <button id="bAuto">🔁<small id="aut">выкл</small></button>
  </div>
  <div id="sheet" hidden><div id="sh"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
const buzz=t=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const note=x=>tg&&tg.showAlert?tg.showAlert(x):alert(x);
const BOT_API="https://dark-lands-bot.onrender.com";/* адрес сервера бота, например https://my-bot.onrender.com */
const notify=(type,text)=>{try{if(!BOT_API||!tg||!tg.initData)return;fetch(BOT_API+"/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData,type,text,tz:new Date().getTimezoneOffset()}),keepalive:true}).catch(()=>{});}catch(e){}};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pc=(a,b)=>Math.max(0,a/b*100);
const KEY="dark-lands-run3",MK="dark-lands-meta";
const EXC=200,ASS=500,SLOT=100,MAXS=4,MAXST=10000,FINAL_HP=1000,REZ=30000,SLM=10,WMAX=50;
// полный сброс: локальный прогресс + облако Telegram
const RSTV="2";let RSTNOW=false;
function wipeAll(){
  try{localStorage.removeItem(KEY);localStorage.removeItem(MK);localStorage.setItem("dl-rst",RSTV);}catch(e){}
  try{const c=tg&&tg.CloudStorage;if(c){const k=["n","t"];for(let i=0;i<60;i++)k.push("p"+i);c.removeItems(k,()=>{});}}catch(e){}
}
try{if(localStorage.getItem("dl-rst")!==RSTV){wipeAll();RSTNOW=true;}}catch(e){}
let m={cr:0,boss:0,slots:1,unl:{},ex:{},daily:{d:"",n:0},sk:{},eq:{},ch:[0,0,0,0,0],pl:{},dv:0,best:0,bk:0,aw:0,ko:0,co:0,xc:0,ac:{},an:{},mute:0,tut:0,inv:0,gk:0,el:0,q:null,fast:0};
let s={stage:1,gold:0,food:5,pot:1,cw:0,cg:0,sel:0,heroes:[],bench:[],inv:[],bf:0};
try{const r=localStorage.getItem(MK);if(r)m=Object.assign(m,JSON.parse(r));}catch(e){}
try{const r=localStorage.getItem(KEY);if(r)s=Object.assign(s,JSON.parse(r));}catch(e){}
m.inv=m.inv|0;m.gk=m.gk|0;m.fast=m.fast|0;m.el=m.el|0;m.ac=m.ac||{};m.an=m.an||{};m.sk=m.sk||{};m.eq=m.eq||{};m.pl=m.pl||{};m.unl=m.unl||{};m.ex=m.ex||{};
m.ch=(Array.isArray(m.ch)?m.ch:[]).concat([0,0,0,0,0]).slice(0,5).map(v=>v|0);
m.slots=Math.max(1,Math.min(MAXS,m.slots|0));
m.best=Math.max(m.best|0,m.boss|0,s.stage|0);if(s.heroes&&s.heroes.length)m.tut=1;
s.bench=s.bench||[];s.heroes=s.heroes||[];
while(s.heroes.length>MAXS)s.bench.push(s.heroes.pop());
if(!(s.sel>=0&&s.sel<s.heroes.length))s.sel=0;
const save=()=>{try{s.last=Date.now();localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem(MK,JSON.stringify(m))}catch(e){}};

function arenaSim(mine,foe){
  const mkU=(x,sd)=>({c:x.c,hp:x.hp,max:x.hp,a:x.a,d:x.d,cd:x.cd||4,t:x.cd||4,sm:x.sm||1,hs:x.hs,ws:x.ws,n:x.n,sd});
  const U=[mine.map(x=>mkU(x,0)),foe.map(x=>mkU(x,1))],frames=[];
  const tot=i=>U[i].reduce((a,u)=>a+Math.max(0,u.hp),0),mx=i=>U[i].reduce((a,u)=>a+u.max,0);
  const fr=lines=>frames.push({u:U.map(r=>r.map(u=>[Math.max(0,Math.round(u.hp)),u.max])),log:lines});
  const nm=u=>CL[u.c].i+" "+(u.n?esc(u.n):CL[u.c].n);
  fr(["⚔️ Бой начался!"]);
  for(let r=1;r<=40&&tot(0)>0&&tot(1)>0;r++){
    const lines=["Раунд "+r],order=[];
    U[0].forEach((u,i)=>order.push(u));U[1].forEach(u=>order.push(u));order.sort(()=>Math.random()-.5);
    for(const u of order){
      if(u.hp<=0)continue;
      const foes=U[1-u.sd].filter(x=>x.hp>0),al=U[u.sd].filter(x=>x.hp>0);if(!foes.length)break;
      const use=u.t<=0,heal=(u.c==="medic"||u.c==="angel");
      if(use)u.t=u.cd;else u.t--;
      if(heal&&use&&u.c==="medic"){al.forEach(x=>x.hp=Math.min(x.max,x.hp+x.max*.25*u.sm));lines.push(nm(u)+" ✨ лечит отряд");continue;}
      if(heal&&!use&&Math.random()<.6){const w=al.slice().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0],g=Math.round(w.max*.07+u.a*.4);w.hp=Math.min(w.max,w.hp+g);lines.push(nm(u)+" 💚 +"+g);continue;}
      const f=foes[rnd(0,foes.length-1)];
      let dm=u.a*(.9+Math.random()*.2);if(Math.random()<.15)dm*=2;
      if(use)dm*=(u.c==="assassin"?4:CL[u.c].dv?4.5:3.5)*u.sm;
      if(use&&heal)al.forEach(x=>x.hp=Math.min(x.max,x.hp+x.max*.2));
      dm=Math.max(1,Math.round(dm*100/(100+f.d*3)));f.hp-=dm;
      lines.push(nm(u)+(use?" ✨":"")+" → "+nm(f)+" −"+dm+(f.hp<=0?" ☠️":""));
    }
    fr(lines.slice(0,6));
  }
  const a=tot(0)/mx(0),b=tot(1)/mx(1);
  return{frames,win:tot(1)<=0?true:tot(0)<=0?false:a>=b};
}

function skillFx(o,h,hp,ep){
  const kind=o.rg,c=FXC[kind]||"#fff",sl=h.sl|0,n=3+Math.floor(sl/3);
  const top=(i)=>({x:ep.x+(i-(n-1)/2)*26,y:-30});
  if(kind==="fire"||kind==="arc"){
    for(let i=0;i<n;i++)shot(kind,top(i),{x:ep.x+(i-(n-1)/2)*12,y:ep.y},46,300,i*90,()=>ring(ep.x+(i-(n-1)/2)*12,ep.y,c,70,380));
    flash(c,.35,300+n*60);
  }else if(kind==="arrow"){
    for(let i=0;i<n+3;i++)shot("arrow",{x:ep.x-90+i*10,y:-20},{x:ep.x+(i-(n+2)/2)*10,y:ep.y},34,260,i*60,()=>ring(ep.x+(i-(n+2)/2)*10,ep.y,c,36,260));
  }else if(kind==="water"){
    for(let i=0;i<n+2;i++)shot("water",{x:hp.x,y:hp.y},{x:ep.x+(i-(n+1)/2)*16,y:ep.y+(i%2?10:-10)},40,330,i*70,()=>ring(ep.x,ep.y,c,90+i*8,460));
    ring(ep.x,ep.y+20,c,160,620,200);
  }else if(kind==="bolt"){
    try{const e=fxEl('<svg viewBox="0 0 40 200" preserveAspectRatio="none"><path d="M24 0L8 70h14L6 130h14L10 200" fill="none" stroke="#fff27a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M24 0L8 70h14L6 130h14L10 200" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>',ep.x,ep.y/2,50+sl*3,ep.y+60,7);
      e.animate([{opacity:0},{opacity:1,offset:.2},{opacity:.1,offset:.4},{opacity:1,offset:.55},{opacity:0}],{duration:520,delay:150,fill:"both"}).onfinish=()=>e.remove();setTimeout(()=>e.remove(),900);}catch(x){}
    flash("#fff6a0",.55,160);ring(ep.x,ep.y,c,130+sl*5,500,200);
  }else if(kind==="gold"){
    for(let i=0;i<n+4;i++)shot("gold",{x:ep.x+(i-(n+3)/2)*22,y:-20},{x:ep.x+(i-(n+3)/2)*14,y:ep.y+(i%2?14:-8)},34,320,i*60,()=>ring(ep.x,ep.y,c,60,320));
    ring(hp.x,hp.y,c,100,500);
  }else if(kind==="curse"){
    shot("curse",{x:hp.x,y:hp.y},{x:ep.x,y:ep.y},58,380,0,()=>{
      try{const e=fxEl(FXS.curse(),ep.x,ep.y,110+sl*5,110+sl*5,7);e.animate([{opacity:0,transform:"scale(.3) rotate(0)"},{opacity:1,transform:"scale(1) rotate(180deg)",offset:.4},{opacity:0,transform:"scale(1.3) rotate(420deg)"}],{duration:900,fill:"both"}).onfinish=()=>e.remove();setTimeout(()=>e.remove(),1200);}catch(x){}
      ring(ep.x,ep.y,c,120,700);});
  }else if(kind==="holy"){
    shot("holy",{x:ep.x+30,y:-40},{x:ep.x,y:ep.y},120,320,0,()=>{ring(ep.x,ep.y,c,150,520);flash("#fff1b8",.6);});
    s.heroes.forEach((q,i)=>{const d=$("h"+i);if(d)ring(cpt(d).x,cpt(d).y,"#7dffa8",60,600,300);});
  }else if(kind==="leaf"||kind==="bullet"||kind==="bone"||kind==="dbolt"||kind==="note"){
    const m2=kind==="dbolt"?3:n+3;
    for(let i=0;i<m2;i++)shot(kind,kind==="note"||kind==="leaf"?{x:hp.x,y:hp.y}:{x:ep.x-80+i*14,y:-20},{x:ep.x+(i-(m2-1)/2)*14,y:ep.y+(i%2?8:-8)},38,300,i*70,()=>ring(ep.x+(i-(m2-1)/2)*10,ep.y,c,64,340));
    ring(ep.x,ep.y,c,130+sl*4,520,260);flash(c,.28,260);
    if(kind==="note")s.heroes.forEach((q,i)=>{const d=$("h"+i);if(d)ring(cpt(d).x,cpt(d).y,c,64,620,200);});
  }else if(kind==="heal"){
    s.heroes.forEach((q,i)=>{const d=$("h"+i);if(d){const p=cpt(d);shot("heal",hp,p,34,380,i*70,()=>ring(p.x,p.y,"#7dffa8",70,520));}});
  }

function spawn(){
  const st=s.stage,zi=Math.floor((st-1)/20)%ZN.length,z=ZN[zi],boss=st%20===0,n=Math.max(1,s.heroes.length),mo=z.m[(st-1)%z.m.length];
  const ramp=Math.min(1,.5+st/36),ramA=Math.min(1,.55+st/45);
  let hp=Math.round((34+13*st**.9)*ramp*(boss?2.6:1)*(1+.85*(n-1)));
  let atk=Math.round((5+1.4*st**.7)*ramA*(boss?1.4:1)),reward=Math.round((6+3*st**.85)*(boss?5:1));
  let art=boss?BOSS[zi]():MOB[mo[0]](),name=boss?"Босс: "+z.bn:mo[1],ab=boss?z.ab:{};
  if(st>=MAXST){hp=FINAL_HP;atk=Math.round(atk*1.3);art=GOLD();name="Мифический золотой дракон";ab={arm:.8,dbl:.3,rage:3};}
  if(s.ev&&s.ev.left<=0){log("🌤️ Событие «"+EVT[s.ev.k][1]+"» закончилось.");s.ev=null;}
  if(!s.ev&&!boss&&st>=8&&st<MAXST&&Math.random()<.05){const k=["night","eclipse","invasion"][rnd(0,2)];s.ev={k,left:6};log(EVT[k][0]+" "+EVT[k][2]);notify("loot",EVT[k][0]+" "+EVT[k][2]);}
  const ek=s.ev&&s.ev.k;
  if(ek==="night"){atk=Math.round(atk*1.25);reward=Math.round(reward*1.5);}
  else if(ek==="eclipse"){hp=Math.round(hp*1.4);reward*=2;}
  else if(ek==="invasion"){reward=Math.round(reward*1.3);}
  let gold=false,elite=false;
  if(!boss&&st>=5&&st<MAXST){const pg=.03*(ek==="invasion"?5:1),pe=.08*(ek==="invasion"?3:1),q=Math.random();if(q<pg)gold=true;else if(q<pg+pe)elite=true;}
  if(gold){hp*=2;atk=Math.round(atk*1.1);reward*=6;name="✨ Золотой "+name;}
  else if(elite){hp=Math.round(hp*1.6);atk=Math.round(atk*1.3);reward=Math.round(reward*2.2);name="💢 Элитный "+name;}
  en={art,name,hp,max:hp,atk,reward,ab,n:0,boss,z,zi,slow:0,sw:0,burn:0,bd:0,weak:0,wet:0,hello:true,gold,elite};
}

function rezTick(){
  const now=Date.now();let ch=false;
  s.heroes.forEach((h,i)=>{
    if(h.hp<=0){
      if(!h.rez)h.rez=now+REZ;
      else if(now>=h.rez){h.hp=Math.ceil(h.maxHp*.5);h.rez=0;h.hun=Math.max(h.hun,40);log("✨ "+CL[h.cls].i+" "+CL[h.cls].n+" воскрес!");setTimeout(()=>{pop("h"+i,"✨","h");say("h"+i,pick1(HR));},60);ch=true;}
    }else if(h.rez)h.rez=0;
  });
  return ch;
}
function win(){
  const boss=en.boss,xp=Math.round((4+Math.round(3*s.stage**.85))*(s.ev&&s.ev.k==="eclipse"?1.5:1)*(en.gold?2:1));
  m.ko=(m.ko|0)+1;qAdd("ko");if(boss){m.bk=(m.bk|0)+1;qAdd("bk");SFX.win();}
  s.gold+=en.reward;let up=0;
  s.heroes.forEach(h=>{if(h.hp>0)h.hp=Math.min(h.maxHp,h.hp+10);up+=gainXp(h,xp)?1:0;});
  let t="🏆 "+en.name+" повержен! +"+en.reward+" 💰 +"+xp+" ✨"+(up?" 🆙":"");
  if(boss){
    s.cg++;t+=" 🟨 сундук!";
    if(s.stage>m.boss){m.boss=s.stage;const c=20+Math.floor(s.stage/20)*2;m.cr+=c;t+=" +"+c+" 💎";notify("boss","🐉 "+en.name+" повержен на этапе "+s.stage+"! +"+c+" 💎");}

    if(it.r>=2)notify("loot","🎁 "+RAR[it.r][0]+" предмет «"+it.n+"» выпал с босса на этапе "+s.stage+"!");
  }else if(Math.random()<.12){s.cw++;t+=" 🟫 сундук!";}
  if(en.gold){m.gk=(m.gk|0)+1;qAdd("gk");const c=rnd(1,3)+Math.floor(s.stage/100);m.cr+=c;t+=" ✨ +"+c+" 💎";if(Math.random()<.5){m.ch[Math.random()<.3?1:0]++;t+=" 📦 сундук!";}}
  else if(en.elite){m.el=(m.el|0)+1;if(Math.random()<.25){s.cw++;t+=" 🟫 сундук!";}}
  if(petDrop(boss?.4:en.gold?.6:en.elite?.08:.012))t+=" 🥚 яйцо питомца!";
  if(s.ev)s.ev.left--;
  chestDrops(s.stage,boss).forEach(r=>{m.ch[r]++;t+=" "+CHI[r]+" "+CHN[r]+" сундук!";if(r>=1)notify("loot",CHI[r]+" "+CHN[r]+" сундук выпал на этапе "+s.stage+"!");});
  log(t);buzz(boss?"heavy":"light");
  if(s.stage>=MAXST){log("🏁 ПОБЕДА! Ты прошёл все 10000 этапов!");notify("win","🏁 Ты победил мифического золотого дракона и прошёл все 10000 этапов!");}else s.stage++;
  m.best=Math.max(m.best|0,s.stage);sendScore();checkAch();
  spawn();
}

      (s.bench.length?'<div class="cht">🪑 Запас (в бою не участвуют)</div>'+s.bench.map((x,i)=>rowB(CL[x.cls].i+" "+hn(x)+" · Ур. "+x.lvl,"❤️ "+x.maxHp+" · ✨ ур."+(x.sl|0),[["✏️","rename","b"+i],[s.heroes.length<m.slots?"В отряд":"Заменить выбранного","unbench",i]])).join(""):"")+
      (Object.keys(CL).some(c=>!allH().some(x=>x.cls===c))?row("➕ Нанять героя","в отряд, если есть место, иначе в запас","Выбрать","recruit"):"")+
      (m.slots<MAXS?row("🔓 Ячейка героя","в отряде до "+MAXS+" героев. Открыто: "+m.slots,"💎 "+SLOT,"slot",m.cr<SLOT):row("Отряд: все "+MAXS+" ячейки открыты",""))+
      row("🔄 Новая игра","кристаллы, скины, ячейки и эксклюзивы сохранятся","Начать","newgame");
  }else if(tab==="rename"){
    const x=renI[0]==="h"?s.heroes[+renI.slice(1)]:s.bench[+renI.slice(1)];
    b=x?'<div class="cht">'+CL[x.cls].i+" Имя для героя ("+CL[x.cls].n+')</div><div class="r"><input id="nm" maxlength="14" value="'+(x.name?esc(x.name):"")+'" placeholder="Например: Артур" style="flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0d0a17;color:var(--text)"><button data-a="savename">Сохранить</button></div>'+row("Сбросить имя","вернуть название класса","Сбросить","savename0"):row("Герой не найден","");
  }else if(tab==="skin"&&h){
    b=skinRows(h);
  }else if(tab==="pets"){
    b=petsRender();
  }else if(tab==="chest"){
    b=(chestMsg?'<div class="cht">'+chestMsg+"</div>":"");
    for(let r=0;r<5;r++)b+=rowB(CHI[r]+" "+CHN[r]+" сундук ×"+m.ch[r],CHR[r]+" · скин героя или оружия",[["Открыть","och",r,m.ch[r]<1],["💎 "+CHP[r],"bch",r,m.cr<CHP[r]]]);
    b+=row("📦 Обычные сундуки","🟫 "+s.cw+" · 🟨 "+s.cg+" — золото, зелья, опыт","Открыть","chest",s.cw+s.cg<1)+
      '<div class="cht">💱 Обмен: 1000 💰 = 1 💎 (в обе стороны)</div>'+
      rowB("💰 → 💎","у тебя "+s.gold+" 💰",[["10 000 → 10","g2c",10,s.gold<10000],["100 000 → 100","g2c",100,s.gold<100000]])+
      rowB("💎 → 💰","у тебя "+m.cr+" 💎",[["10 → 10 000","c2g",10,m.cr<10],["100 → 100 000","c2g",100,m.cr<100]]);
  }else if(tab==="bt"){
    b=bt?btRender():row("Бой не найден","");
  }else if(tab==="arena"){
    if(!arena)b=row("⏳ Загрузка...","сервер может просыпаться до минуты");
    else if(arena.off)b=row("⚔️ Арена","доступна, когда игра открыта через бота в Telegram");
    else if(arena.err)b=row("😴 Сервер не отвечает","он мог уснуть. Закрой вкладку и открой снова через минуту");
    else{
      const me=arena.me,md=["🥇","🥈","🥉"];
      b='<div class="cht">⚔️ Рейтинг <b>'+me.rating+"</b> · место #"+(me.rank||"—")+" · побед "+me.w+" / поражений "+me.l+"<br>Боёв сегодня осталось: <b>"+me.left+"</b> из 5"+(arena.db?"":"<br><small>⚠️ без базы данных: рейтинг пропадает при перезапуске сервера</small>")+"</div>"+
        arena.opps.map(o=>rowB("🛡️ "+esc(o.name),"рейтинг "+o.rating+" · сила "+o.pw+(o.uid<0?" · страж арены":"")+(o.w+o.l?" · "+o.w+"п/"+o.l+"пор":""),[["⚔️ Бой","afight",o.uid,me.left<1]])).join("")+
        row("🔄 Другие соперники","","Обновить","arefresh")+
        '<div class="cht">🏆 Лучшие на арене</div>'+arena.top.map((t,i)=>'<div class="r"'+(t.me?' style="background:#2a1f48;border-radius:8px;padding-left:8px"':"")+"><div>"+(md[i]||"#"+(i+1))+" "+esc(t.n)+"</div><b>"+t.r+"</b></div>").join("")+
        '<div class="cht"><small>Твой отряд на арене — тот, что в бою сейчас. Победа: +3 💎. Защитник получит уведомление в бот.</small></div>';
    }
  }else if(tab==="top"){
    if(!topData)b=row("⏳ Загрузка...","если сервер спал, подожди до минуты");
    else if(topData.off)b=row("🏆 Таблица лидеров","доступна, когда игра открыта через бота в Telegram");
    else if(topData.err)b=row("😴 Сервер не отвечает","он мог уснуть. Закрой вкладку и открой снова через минуту");
    else{
      const md=["🥇","🥈","🥉"];
      b=(topData.me?'<div class="cht">Твоё место: <b>#'+topData.me.rank+"</b> из "+topData.total+" · этап "+topData.me.s+"</div>":'<div class="cht">Пройди хотя бы один этап, чтобы попасть в таблицу</div>')+
        topData.top.map((t,i)=>'<div class="r"'+(t.me?' style="background:#2a1f48;border-radius:8px;padding-left:8px"':"")+"><div>"+(md[i]||"#"+(i+1))+" "+esc(t.n)+"</div><b>этап "+t.s+"</b></div>").join("");
    }
  }else if(tab==="q"){
    qEnsure();const q=m.q;
    b='<div class="cht">📅 Задания на сегодня</div>'+q.list.map((a,i)=>row(a.n+" · "+Math.min(q.p[a.k]|0,a.t)+"/"+a.t,"награда: 💎 "+a.r,a.c?"✅":qDone(a)?"Забрать":"…","claimQ",!qDone(a)||a.c,i)).join("")+
      row("🎁 Все три задания","бонус: 💎 15 и эпический сундук",q.all?"✅":q.list.every(a=>a.c)?"Забрать":"…","claimQall",q.all||!q.list.every(a=>a.c))+'<div class="cht">Новые задания появляются каждый день</div>';
  }else if(tab==="ach"){
    b=ACH.map(a=>{const ok=a[3](),dn=m.ac[a[0]];return row(a[1],a[2]+" · 💎 "+a[4],dn?"✅":ok?"Забрать":"…","claimA",!ok||dn,a[0]);}).join("");
  }else if(tab==="tut"){
    const t=TUT[tutI];b='<div class="cht"><b>'+t[0]+"</b><br>"+t[1]+"</div>"+row("Шаг "+(tutI+1)+" из "+TUT.length,"",tutI<TUT.length-1?"Дальше":"Начать игру","tutn");
  }else if(tab==="gift"){
    const n=dailyDay(),r=dRew(n||1);
    b=(n?row("🎁 Ежедневная награда, день "+n+" из 7","💰 "+r.g+" · 🍖 "+r.f+(r.p?" · 🧪":"")+(r.cw?" · 🟫":"")+(r.cg?" · 🟨×"+r.cg:""),"Забрать","claim"):row("🎁 Награда получена","приходи завтра, серия дней даёт больше"))+'<div class="cht">⚙️ Настройки</div>'+'<div class="cht">👥 Друзья</div>'+row("Пригласи друга","тебе +20 💎 за каждого, другу +10 💎 · приглашено: "+(m.inv|0),tg?"Позвать":"","invite")+row("🗑 Начать с нуля","удалит весь прогресс, героев и достижения","Сбросить","reset")+row("⏩ Быстрые анимации",m.fast?"включены: бои идут быстрее":"выключены: красивые длинные анимации",m.fast?"Выключить":"Включить","fast")+row("🔊 Звук",m.mute?"выключен":"включён",m.mute?"Включить":"Выключить","snd")+row("☁️ Облако Telegram",CS?"прогресс копируется в облако и подхватывается на другом устройстве":"доступно только внутри Telegram","","");
  }
  const head=tab==="bt"?'<div class="tabs"><b style="padding:6px 8px">⚔️ Арена</b></div>':tab==="tut"?'<div class="tabs"><b style="padding:6px 8px">Как играть</b></div>':tab==="rename"?'<div class="tabs"><button data-t="team">← Назад</button></div>':tab==="pick"?(s.heroes.length?'<div class="tabs"><button data-a="close">✕ Закрыть</button></div>':'<div class="tabs"><b style="padding:6px 8px">Выбери героя</b></div>'):'<div class="tabs">'+T.map(t=>'<button data-t="'+t[0]+'"'+(t[0]===tab?' class="on"':"")+">"+t[1]+"</button>").join("")+'<button data-a="close">✕</button></div>';
  $("sh").innerHTML=head+'<div class="body">'+b+"</div>";
}
const ACT={
  close(){if(tab==="bt"&&bt&&!bt.done)return;if(s.heroes.length)$("sheet").hidden=true;},
  afight(u){if(!arena||!arena.me||arena.me.left<1||!s.heroes.length)return;post("/arena/fight",{opp:+u}).then(r=>r.json()).then(d=>{if(d.error){note(d.error==="limit"?"Бои на сегодня закончились":"Соперник недоступен, обнови список");fetchArena();return;}startBattle(d.opp);}).catch(()=>note("Сервер не отвечает, попробуй позже"));},
  arefresh(){fetchArena();},
  btskip(){if(bt&&!bt.done)btFinish();},
  btend(){clearInterval(btTimer);bt=null;tab="arena";fetchArena();},
  pick(c){
    const d=CL[c];
    if(d.pr&&!m.unl[c]){if(m.cr<d.pr)return note("Нужно "+d.pr+" 💎, у тебя "+m.cr+". Кристаллы дают боссы, сундуки и обмен золота.");m.cr-=d.pr;m.unl[c]=true;}
    pick(c);
  },
  sel(i){s.sel=+i;},
  claimA(id){const a=ACH.find(x=>x[0]===id);if(!a||m.ac[id]||!a[3]())return;m.ac[id]=1;m.cr+=a[4];SFX.ach();log("🏅 Награда: +"+a[4]+" 💎 — "+a[1]);},
  invite(){try{const u="https://t.me/share/url?url="+encodeURIComponent(inviteLink())+"&text="+encodeURIComponent("Заходи в «Пепел Эльдары» — фэнтези-RPG прямо в Telegram! Тебе +10 💎 за вход по моей ссылке.");
    if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,"_blank");}catch(e){}},
  reset(){const q="Сбросить ВСЁ: героев, уровни, достижения, скины, кристаллы и прогресс? Это нельзя отменить.";
    const go=()=>{wipeAll();try{if(tg&&tg.CloudStorage)setTimeout(()=>location.reload(),500);else location.reload();}catch(e){location.reload();}};
    if(tg&&tg.showConfirm)tg.showConfirm(q,ok=>{if(ok)go();});else if(confirm(q))go();},
  claimQ(i){qEnsure();const a=m.q.list[+i];if(!a||a.c||!qDone(a))return;a.c=1;m.cr+=a.r;SFX.ach();log("📅 Задание выполнено: +"+a.r+" 💎");},
  claimQall(){qEnsure();const q=m.q;if(q.all||!q.list.every(a=>a.c))return;q.all=1;m.cr+=15;m.ch[1]++;SFX.chest();log("📅 Все задания дня: +15 💎 и эпический сундук!");},
  fast(){m.fast=m.fast?0:1;},
  snd(){m.mute=m.mute?0:1;if(!m.mute)SFX.ach();},
  tutn(){if(tutI<TUT.length-1){tutI++;}else{m.tut=1;if(s.heroes.length)$("sheet").hidden=true;else tab="pick";}},
  rename(i){renI=i;tab="rename";},
  savename(){const x=renI[0]==="h"?s.heroes[+renI.slice(1)]:s.bench[+renI.slice(1)];const v=($("nm")&&$("nm").value||"").trim().slice(0,14);if(x){if(v)x.name=v;else delete x.name;}tab="team";},
  savename0(){const x=renI[0]==="h"?s.heroes[+renI.slice(1)]:s.bench[+renI.slice(1)];if(x)delete x.name;tab="team";},
  recruit(){tab="pick";},
  slot(){if(m.slots>=MAXS||m.cr<SLOT)return;m.cr-=SLOT;m.slots++;log("🔓 Открыта ячейка героя!");},
  bench(i){i=+i;if(s.heroes.length<2)return;s.bench.push(s.heroes.splice(i,1)[0]);s.sel=Math.max(0,Math.min(s.sel,s.heroes.length-1));spawn();},
  unbench(i){i=+i;const x=s.bench[i];if(!x)return;if(s.heroes.length<m.slots){s.bench.splice(i,1);s.heroes.push(x);s.sel=s.heroes.length-1;}else{const o=s.heroes[s.sel];s.heroes[s.sel]=x;s.bench[i]=o;}spawn();},
  upS(){const h=sel(),c=slCost(h);if((h.sl|0)>=SLM||s.gold<c)return;s.gold-=c;h.sl=(h.sl|0)+1;log("✨ "+CL[h.cls].sk+" улучшен до ур. "+h.sl);},
  upW(){const h=sel(),c=costs(h).sword;if(h.wl>=WMAX||s.gold<c)return;s.gold-=c;h.wl++;log(wp(h)[0]+" "+wp(h)[1]+" улучшен до ур. "+h.wl);},
  upA(){const h=sel(),nx=ARM[h.arm+1];if(!nx)return;if(nx[2]){if(s.gold<nx[2])return;s.gold-=nx[2];}else{if(m.cr<nx[3])return;m.cr-=nx[3];}h.arm++;log("🛡️ "+CL[h.cls].i+" получил: "+nx[0]);},
  ex(){const h=sel();if(m.ex[h.cls]||m.cr<EXC)return;m.cr-=EXC;m.ex[h.cls]=true;log("💎 Эксклюзив: "+CL[h.cls].x[1]+"!");},
  bpot(){const c=costs(sel()).pot;if(s.gold<c)return;s.gold-=c;s.pot++;},
  bfood(){const c=costs(sel()).food*3;if(s.gold<c)return;s.gold-=c;s.food+=3;},
  pot(){const h=sel();if(!h||s.pot<1||h.hp>=h.maxHp)return;s.pot--;const was=h.hp<=0;h.hp=Math.min(h.maxHp,Math.max(h.hp,0)+Math.ceil(h.maxHp/2));h.rez=0;log(was?"✨ "+CL[h.cls].i+" воскрешён зельем!":"🧪 "+CL[h.cls].i+" выпил зелье.");pop("h"+s.sel,"💚","h");},
  feed(){let n=0;s.heroes.forEach(h=>{if(h.hun<=70&&s.food>0){s.food--;h.hun=Math.min(100,h.hun+40);n++;}});if(n)log("🍖 Накормлено героев: "+n);},
  equip(i){const h=sel(),it=s.inv[+i];if(!it)return;const k=it.t==="w"?"lw":"la",old=h[k];h[k]=it;s.inv.splice(+i,1);if(old)s.inv.push(old);log("🎒 "+CL[h.cls].i+" надел: "+it.n);},
  sell(i){const it=s.inv[+i];if(!it)return;s.inv.splice(+i,1);s.gold+=it.v*6;},
  claim(){const n=dailyDay();if(!n)return;const r=dRew(n);m.daily={d:dk(0),n};s.gold+=r.g;s.food+=r.f;s.pot+=r.p;s.cw+=r.cw;s.cg+=r.cg;log("🎁 День "+n+": +"+r.g+" 💰 +"+r.f+" 🍖");notify("daily","🎁 Награда за день "+n+" получена. Завтра будет новая!");},
  chest(){openChest();},phatch(){petHatch();},pbuy(){petBuy();},pact(i){petSet(i);},pup(i){petUp(i);},pgo(i){petGo(+i);},pclaim(){petClaim();},
  och(i){openCh(+i);},
  bch(i){i=+i;if(m.cr<CHP[i])return;m.cr-=CHP[i];m.ch[i]++;chestMsg="Куплен: "+CHI[i]+" "+CHN[i]+" сундук. Нажми «Открыть».";},
  g2c(n){n=+n;if(s.gold<n*1000)return;s.gold-=n*1000;m.cr+=n;m.xc=1;checkAch();chestMsg="Обмен: −"+n*1000+" 💰, +"+n+" 💎";},
  c2g(n){n=+n;if(m.cr<n)return;m.cr-=n;s.gold+=n*1000;chestMsg="Обмен: −"+n+" 💎, +"+n*1000+" 💰";},
  seq(i){const h=sel(),[k,r]=i.split(":"),key=k+":"+h.cls;if(+r<0)delete m.eq[key];else if(skOwn(k,h.cls,+r))m.eq[key]=+r;},
  sbuy(i){
    const h=sel(),[k,r0,cur]=i.split(":"),r=+r0;if(skOwn(k,h.cls,r))return;
    if(r>=9)return;
    if(cur==="g"){if(r>1||s.gold<SKPR[r]*1000)return;s.gold-=SKPR[r]*1000;}else{if(m.cr<SKPR[r])return;m.cr-=SKPR[r];}
    m.sk[k+":"+h.cls+":"+r]=1;m.eq[k+":"+h.cls]=r;log("🎨 Куплен скин: "+RAR[r][0]+" "+(k==="h"?"героя":"оружия")+" — "+CL[h.cls].n);
  },
  newgame(){
    const q="Начать заново? Прогресс забега сбросится, кристаллы, сундуки, скины, ячейки и эксклюзивное оружие сохранятся.";
    const go=()=>{s={stage:1,gold:0,food:5,pot:1,cw:0,cg:0,sel:0,heroes:[],bench:[],inv:[],bf:0};m.pl={};m.dv=0;logs=[];save();spawn();draw();openSheet("pick");};
    if(tg&&tg.showConfirm)tg.showConfirm(q,ok=>{if(ok)go();});else if(confirm(q))go();
  }
};
function act(a,i){
  if(!ACT[a])return;
  ACT[a](i);save();draw();
  if(!$("sheet").hidden)render();
}
$("sheet").onclick=e=>{
  if(e.target===$("sheet")){ACT.close();return;}
  const b=e.target.closest&&e.target.closest("button");if(!b)return;
  if(b.dataset.t){tab=b.dataset.t;if(tab==="top")fetchTop();if(tab==="arena")fetchArena();render();return;}
  act(b.dataset.a,b.dataset.i);
};
$("team").onclick=e=>{const d=e.target.closest&&e.target.closest(".sp");if(d){s.sel=+d.dataset.i;draw();}};
const swing=k=>{if(Date.now()<busyUntil)return;attack(k);busyUntil=Date.now()+animMs;};
$("bAtk").onclick=()=>swing(null);
$("bSkill").onclick=()=>swing(sel());
$("bPot").onclick=()=>act("pot");
$("bFeed").onclick=()=>act("feed");
$("bCh").onclick=()=>openSheet("chest");
$("bAuto").onclick=()=>{auto=!auto;$("aut").textContent=auto?"вкл":"выкл";$("bAuto").style.background=auto?"#2f8a3e":"";};
setInterval(()=>{try{
  if(!auto||!$("sheet").hidden||Date.now()<busyUntil||!s.heroes.some(h=>h.hp>0))return;
  const w=s.heroes.findIndex(h=>h.hp>0&&h.hp<h.maxHp*.3);if(w>=0&&s.pot>0){s.sel=w;act("pot");}
  if(s.food>0&&s.heroes.some(h=>h.hun<=40))act("feed");
  swing(s.heroes.find(h=>h.hp>0&&h.cd<=0)||null);
}catch(e){}},500);
document.addEventListener("visibilitychange",()=>{if(document.hidden){save();cloudSave(true);}});
setInterval(()=>cloudSave(false),60000);
$("bGift").onclick=()=>openSheet("gift");
$("bMenu").onclick=()=>openSheet("shop");
spawn();
rezTick();
setInterval(()=>sendScore(),30000);
setInterval(()=>{try{
  if(!s.heroes.length)return;
  const c=rezTick();
  if(c){save();draw();if(!$("sheet").hidden)render();}
  else if(s.heroes.some(h=>h.hp<=0||h.cls==="witch"))draw();
}catch(e){}},1000);
let offMsg="";
if(s.heroes.length&&s.last){
  const el=Math.min(Date.now()-s.last,8*3600000);
  if(el>120000){const mn=el/60000,g=Math.round(mn*(2+s.stage*.8)),xp=Math.round(mn*(1+s.stage*.15));s.gold+=g;s.heroes.forEach(h=>gainXp(h,xp));
    offMsg="🌙 Отряд тренировался "+(el>=3600000?Math.floor(el/3600000)+" ч ":"")+Math.floor(el/60000%60)+" мин: +"+g+" 💰 +"+xp+" ✨";}
}
checkAch();
if(s.heroes.length){log(offMsg||"🌑 С возвращением в Пепел Эльдары!");draw();if(!m.tut)openSheet("tut");}
else{log("🌑 Добро пожаловать в Пепел Эльдары, герой!");draw();openSheet(m.tut?"pick":"tut");}
cloudLoad();fetchMe();
</script>
